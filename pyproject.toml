[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Supplies the `version` that [project] declares dynamic, from `git describe`. Two
# consequences worth knowing:
#   * The build needs the tag to be visible. hatch-vcs does not fail without it -- it
#     falls back to a dev version like 0.7.4.dev3+g<sha> -- so rhiza_release.yml checks
#     the built distribution's filename against the tag, and its checkout uses
#     fetch-depth: 0. An sdist carries the resolved number in PKG-INFO, so building from
#     one needs no git.
#   * Between tags the local version is the *next* patch as a dev release
#     (guess-next-dev, the default), which is why nothing pins a fallback-version here:
#     a wrong-looking version must surface as a release failure, not as a plausible
#     constant.
[tool.hatch.version]
source = "vcs"

[project]
name = "basanos"
# Derived from the git tag by hatch-vcs (see [tool.hatch.version]) rather than written
# here, so the tag is the single source of truth and a release is `git tag` alone -- no
# bump commit, and no way for a number in this file to disagree with what was tagged.
dynamic = ["version"]
description = "Correlation-aware portfolio optimization and analytics for Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cvx-linalg>=0.9.0",
    "jinja2>=3",
    "jquantstats>=0.9",
    "numpy>=2.4",
    "plotly>=6.6.0",
    "polars>=1.37.1",
    "pydantic>=2.12.5",
    "scipy>=1.17.0",
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    { name = "Thomas Schmelzer", email = "thomas.schmelzer@gmail.com" },
]

[project.urls]
Homepage = "https://github.com/Jebel-Quant/basanos"
Repository = "https://github.com/Jebel-Quant/basanos"
Issues = "https://github.com/Jebel-Quant/basanos/issues"


[dependency-groups]
dev = [
    "marimo>=0.21.0",
    "pandas>=3.0",
    "pyarrow>=14.0"
]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-mock>=3.0",
    "pytest-xdist>=3.0",
    "hypothesis>=6.150.0",
]
# There is no `lint` group: pre-commit/prek and deptry run through uvx, and `typecheck`
# injects `--with ty`, so nothing would resolve one from the project environment.

[tool.hatch.build.targets.wheel]
packages = ["src/basanos"]

[tool.rhiza-task]
# Settings for the task runner that replaced the synced make layer in rhiza v1.4.0.
# Read as layer 4 of rhiza-task's resolution order (dataclass defaults -> .rhiza/.env ->
# rhiza.toml -> pyproject.toml -> RHIZA_* environment -> CLI flags). Only entries that
# differ from the CLI's own defaults belong here; `uvx rhiza-task print <setting>` shows
# what one resolves to, which is also how each value below was checked against 0.3.1.

# This repo keeps its Marimo notebooks in book/marimo/notebooks, not the CLI default of
# docs/notebooks. `book` exports them to docs/notebooks/*.html, which is what mkdocs.yml's
# nav references, and rhiza_marimo.yml reads this setting to build its notebook matrix.
#
# The setting is load-bearing rather than tidy: it lived in `.rhiza/.env`, which v1.4.2 no
# longer ships (jebel-quant/rhiza#1545) and this sync therefore deleted. Without it here,
# `marimo` and `book` resolve to an empty docs/notebooks and skip every notebook -- a green
# gate measuring nothing.
marimo-folder = "book/marimo/notebooks"

# The retired python.mk had `TYPECHECKER ?= both`; the CLI defaults to `ty` alone, so a bare
# migration would have dropped `mypy --strict` from this repo's typecheck gate -- the one the
# README describes, and the reason [tool.mypy] and its scientific-dependency overrides are
# in this file at all. `both` is also stricter here than it was under make: the shell `case`
# let mypy's exit status win, so a ty failure could pass, where the CLI raises on each run.
typechecker = "both"

# Pinned to the last release that agrees with `mypy --strict` about this repo's mixin
# layout. rhiza v1.7.2 resolved `ty` unpinned, so CI silently tracked whatever was
# newest; v1.8.0 (via rhiza-task 1.7.0) both pins it and defaults the pin to 0.0.78,
# which is where the verdict changed -- on source this PR does not touch:
#
#   ty 0.0.77  -> All checks passed!
#   ty 0.0.78  -> Found 13 diagnostics   (0.0.79 likewise)
#
# All 13 reduce to one claim: `BasanosEngine` is not assignable to `_EngineProtocol`
# because "protocol member `_ic_series` is incompatible". It is assignable. The two
# bound methods are the same type -- `(use_rank: bool, h: int = 1) -> DataFrame` --
# and the only asymmetry is that the mixin annotates `self: _EngineProtocol`, the
# idiom every mixin in `_engine_*.py` uses to type `self.mu`, `self.cor` et al. That
# makes conformance recursive (the protocol member is supplied by a method whose
# `self` is the protocol), which mypy resolves co-inductively and 0.0.78 does not --
# it rewrote exactly this area ("optimize recursive protocol checks", "treat captured
# bound-method receivers covariantly") and shipped at least one acknowledged protocol
# regression of the same family, astral-sh/ty#4459.
#
# So: a tool release changed, not this code, and `mypy --strict` -- the stricter half
# of `typechecker = "both"` -- still passes clean. Pinning keeps `ty` enforced at full
# strength on the rule set that was green rather than muting a rule or dropping a
# checker. Revisit when a release resolves the recursive case; `ty_version = ""` goes
# back to newest-available.
ty_version = "==0.0.77"

# The retired quality.mk pinned `RHIZA_CHECKS_VERSION ?= 0.2.1` and installed
# `pytest-rhiza==$(RHIZA_CHECKS_VERSION)` from PyPI. rhiza-task 0.3.1 defaults to a *git*
# ref one patch behind (`... @ git+https://github.com/Jebel-Quant/pytest-rhiza@v0.2.0`), so
# a bare migration would have both downgraded the conformance checks -- the drift the pin
# exists to prevent -- and swapped a released wheel for a clone. Pinned exactly rather than
# floored: a gate that moves under you is not a gate.
#
# 0.6.0 is required by this repo's dynamic [project].version, not merely available: it is
# the first release whose test_pyproject accepts a version derived from the VCS. Under
# 0.2.1 three of its assertions read `[project].version` as the empty string and fail --
# the required-field check, the semver shape, and the tag-agreement one -- because they
# predate `dynamic = ["version"]` being a thing a rhiza project could do. 0.6.0 skips each
# with a reason instead. jquantstats, which made this move first, pins the same version.
pytest-rhiza = "pytest-rhiza==0.6.0"

# Not set, on purpose:
#   source-folder / tests-folder -- `src` and `tests` are already this repo's layout, and
#       were what `.rhiza/.env` restated.
#   coverage-fail-under -- the CLI default is 90, which is exactly [tool.coverage.report]'s
#       `fail_under` below. Worth knowing they are two settings and not one: the `test` task
#       passes `--cov-fail-under=<setting>` on the command line, which outranks the config
#       file, so raising the bar means raising it in *both* places or the config file starts
#       claiming a threshold nothing enforces.
#   mkdocs-extra-packages -- the retired root Makefile carried
#       `MKDOCS_EXTRA_PACKAGES = --with 'mkdocstrings[python]'` for the API reference under
#       docs/api/; rhiza-task 0.3.1 makes `mkdocstrings[python]` the default, so the
#       override is now redundant rather than lost. Restore it here if that ever changes.
#   ci-os-matrix -- the single-OS default is what this repo wants, and `rhiza_ci.yml`
#       exports the variable *empty* for consumers so their own configuration can answer
#       (jebel-quant/rhiza#1526, #1545). Pinning it here would be a decision, not a
#       migration.
#   layers / rhiza-checks -- `python` is detected from pyproject.toml, and the five checks
#       derived from it are the same set quality.mk's `RHIZA_CHECKS` accumulated.

[tool.deptry]
# Explicit module name map so deptry doesn't need to inspect installed packages

[tool.deptry.package_module_name_map]
"cvx-linalg" = "cvx"
"jinja2" = "jinja2"
"jquantstats" = "jquantstats"
"numpy" = "numpy"
"plotly" = "plotly"
"polars" = "polars"
"pydantic" = "pydantic"
"scipy" = "scipy"
"marimo" = "marimo"
"pandas" = "pandas"
"pyarrow" = "pyarrow"

[tool.coverage.report]
fail_under = 90
exclude_also = [
    # TYPE_CHECKING blocks are never executed at runtime
    "if TYPE_CHECKING:",
    # Protocol bodies are structural type stubs, not runnable code
    "class .*\\(Protocol\\):",
    "\\.\\.\\.\\s*$",
]

[tool.coverage.run]
omit = [
    # Pure type-stubs file; only imported under TYPE_CHECKING
    "src/basanos/math/_engine_protocol.py",
]

[tool.interrogate]
fail-under = 100
ignore-init-method = true
ignore-magic = true
exclude = ["book"]

[tool.check_test_layout]
# Tests are grouped by *behaviour*, not mirrored one-to-one onto source modules:
# a single module is often exercised by several suites (optimizer.py is covered
# by test_optimizer.py, test_optimizer_property.py and test_optimizer_edge_cases.py),
# and whole-pipeline suites (*_notebook, numerical regression/stability, the
# paper-example walkthrough) map to no single source file. Parity is still
# enforced, by scripts/check_test_layout.py, and per-module coverage by the
# full-coverage pytest gate. This table tells generic mirror-checkers not to
# re-derive a convention this repo does not use.
#
# The script runs from tests/test_test_layout.py, i.e. inside the `test` gate --
# one of the four jobs the required CI gate aggregates. It used to run from
# `make test-layout`, a prerequisite of `make test`; rhiza v1.4 retired the synced
# make layer and CI now invokes the gates through rhiza-task, so that target is
# gone and a repo-local make target would not run in CI. An opt-out is only honest
# while the mechanism it names still runs -- hence the test.
#
# Keep the `reason` value free of literal `%` signs: radon reads every [tool.*]
# table in this file through configparser, which treats `%` as interpolation
# syntax and raises on a bare one.
enforce = false
reason = "Tests are grouped by behaviour; parity is enforced by scripts/check_test_layout.py and per-module coverage by the full-coverage pytest gate."

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
# Catch calls where argument types do not match the declared parameter types.
call-non-callable = "error"
# Catch overload resolution failures.
no-matching-overload = "error"

[tool.mypy]
# `make typecheck` runs `mypy --strict` as a cross-check; the settings here only
# scope the scientific dependencies that ship no type information (no py.typed).

[[tool.mypy.overrides]]
module = ["cvx.*", "scipy.*", "plotly.*"]
ignore_missing_imports = true

# Moved here from .rhiza/.cfg.toml: bump-my-version searches only
# .bumpversion.toml, .bumpversion.cfg, setup.cfg and pyproject.toml, so a table
# under .rhiza/ was never auto-discovered. It fell back to `git describe`, which
# is how a release can be offered a version that was already published.
[tool.bumpversion]
# No current_version and no [[tool.bumpversion.files]] entry for the project
# version: [project].version is dynamic, derived from the git tag by hatch-vcs, so
# there is no number in any file for a bump to rewrite. bump-my-version resolves the
# current version from the newest reachable tag instead — the same answer hatch-vcs
# gives — and still proposes the right next number, it just no longer writes it.
# Adding an entry would fail rather than no-op: a `search` pattern that occurs zero
# times is an error, and check-bumpversion-config reports it at commit time.
allow_dirty = false
# /rhiza:release commits and tags itself, so the regenerated CHANGELOG.md lands
# in the bump commit. A bare `bump-my-version bump` would add a second commit
# and a duplicate tag.
commit = false
tag = false
# Retained from the previous config so pre-release bumps (0.8.0-rc.1,
# 0.8.0-alpha.2, ...) keep parsing and serializing as they did before.
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "a", # PEP 440 short form for alpha
    "beta",
    "b", # PEP 440 short form for beta
    "rc",
    "prod",
]
