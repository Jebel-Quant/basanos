repository: jebel-quant/rhiza
ref: "v1.6.0"

profiles:
  - github-project

templates:
  - legal

# Destination paths the sync must not deliver -- where a file lands in *this* repo, not
# where it sits in the template clone. A directory entry covers everything beneath it.
#
# The three entries that stood here until v1.4.2 were spelled
# `bundles/github/.github/workflows/...`, a clone-relative form `normalise_excludes` never
# matched: it takes each entry as written and only tidies separators. That is how
# `rhiza_fuzzing.yml` came to sit in `.github/workflows` while this file claimed it was
# excluded, and why `rhiza_weekly.yml` and `rhiza_scorecard.yml` are no longer listed --
# they were never actually declined, so keeping them would be a new decision dressed up as
# a spelling fix. Both stay synced.
exclude:
  # The template's PAT_TOKEN and release-secret walkthrough. It documents secrets a
  # consumer configures once in the GitHub UI, addressed to whoever set the repository up
  # rather than to anyone reading the tree. Upstream is where it belongs, and where it stays.
  - .github/CONFIG.md

